# Demo server: runs prebuilt images from GHCR, never builds.
# CI (.github/workflows/images.yml) copies this file and ../postgres/init.sh
# (as postgres-init.sh) to the server, writes .env on the first deploy and runs
#   docker compose pull && docker compose up -d
# Sized for a small box shared with other things: about 700 MB in total at the
# limits, usually well under 300 MB in use.
#
# .env next to this file (generated by the deploy job, edit freely):
#   DOMAIN            1.2.3.4.nip.io or your own domain with a wildcard DNS record
#   WEB_PORT          host port for the app, 80 by default
#   POSTGRES_PASSWORD superuser password (hex, no URL-special characters)
#   APP_DB_PASSWORD   password of the API's runtime role (same rule)
#   JWT_SECRET        at least 32 characters
#   IMAGE_TAG         image tag to run, `latest` by default (or a commit SHA)
#   OPENAI_API_KEY / MISTRAL_API_KEY / ANTHROPIC_API_KEY  optional, for menu import
name: menuly

x-api-env: &api-env
  # Not "production": the demo account is seeded, and seeding refuses production.
  APP_ENV: demo
  DATABASE_URL: postgres://menuly_app:${APP_DB_PASSWORD:?}@postgres:5432/menuly?sslmode=disable&pool_max_conns=8
  MIGRATE_DATABASE_URL: postgres://menuly:${POSTGRES_PASSWORD:?}@postgres:5432/menuly?sslmode=disable
  JWT_SECRET: ${JWT_SECRET:?}
  STORAGE_DIR: /data/uploads
  APP_URL: http://${DOMAIN:?}
  PUBLIC_API_URL: http://${DOMAIN}/api
  PUBLIC_MENU_URL: http://{tenant}.${DOMAIN}/{venue}
  CORS_ALLOWED_ORIGINS: http://${DOMAIN}
  OCR_WORKERS: "1"
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  OCR_PROVIDER: ${OCR_PROVIDER:-}
  OCR_MODEL: ${OCR_MODEL:-}
  OCR_EFFORT: ${OCR_EFFORT:-medium}
  GOMEMLIMIT: 150MiB

x-api: &api
  image: ghcr.io/nnikolag/menuly-api:${IMAGE_TAG:-latest}
  environment: *api-env
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  postgres:
    image: postgres:16-alpine
    # Small-box tuning; the defaults assume Postgres owns the machine.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    environment:
      POSTGRES_USER: menuly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: menuly
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menuly -d menuly"]
      interval: 5s
      timeout: 3s
      retries: 30
    shm_size: 64m
    mem_limit: 320m
    restart: unless-stopped
    logging: *logging

  migrate:
    <<: *api
    command: ["migrate", "up"]
    restart: "no"
    mem_limit: 128m
    depends_on:
      postgres:
        condition: service_healthy

  # Demo account (demo@menuly.app / demo1234); leaves existing data alone.
  seed:
    <<: *api
    command: ["seed"]
    restart: "no"
    mem_limit: 128m
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *api
    command: ["serve"]
    mem_limit: 200m
    volumes:
      - uploads:/data/uploads
    depends_on:
      seed:
        condition: service_completed_successfully

  web:
    image: ghcr.io/nnikolag/menuly-web:${IMAGE_TAG:-latest}
    environment:
      API_UPSTREAM: http://api:8080
      BASE_DOMAIN: ${DOMAIN}
    ports:
      - "${WEB_PORT:-80}:80"
    mem_limit: 64m
    restart: unless-stopped
    logging: *logging
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
