openapi: 3.1.0
info:
  title: Menuly API
  version: 0.3.0
  description: |
    Multi-tenant API for Menuly. All authenticated routes act inside the tenant
    carried by the access token (`tid` claim). Switch tenants with
    `POST /v1/auth/switch-tenant`.

    The role is read from the database on every request, not from the token: a role change applies at once,
    a member removed from the tenant gets 401, and a suspended tenant gets 403 `tenant_suspended`.

    Errors always have the shape `{"error": {"code": "...", "message": "..."}}`.
    Validation errors are 422 `validation_failed`; a resource of another tenant is always 404.

    Venue access: a manager or staff member can be limited to some venues (`venue_ids` on the member,
    see `PATCH /v1/members/{userID}`). Empty `venue_ids` means every venue; owners always reach every venue.
    For a limited member, other venues and everything in them (menus, categories, items, variants,
    themes, promotions, imports, stats) behave as if they did not exist: lists leave them out and
    direct requests answer 404. Changes apply to the member's next request (no new login needed).
    `GET /v1/me` returns the caller's `venue_ids`.

    Prices are integers in the minor unit of the venue currency (`price_minor`: 35000 = 350,00 RSD).
    Text fields are Serbian; other languages go in `translations`.

    Interactive docs: `/docs` (Swagger UI) on a running API.
tags:
  - { name: System }
  - { name: Auth }
  - { name: Venues }
  - { name: Menus }
  - { name: Categories }
  - { name: Items }
  - { name: Prices }
  - { name: Public }
  - { name: Promotions, description: "Combo offers: a fixed price for a set of slots, each a fixed item or a choice" }
  - { name: Imports, description: "OCR import of an existing (paper/PDF) menu: upload, review the draft, commit into a menu" }
  - { name: Media, description: "Image uploads for items, promotions, logos and covers" }
  - { name: Team, description: "Members of a tenant and email invitations" }
  - { name: Admin, description: "Platform admin (users.is_platform_admin); 403 for everyone else" }
servers:
  - url: http://localhost:8080
security:
  - bearer: []
paths:
  /healthz:
    get:
      operationId: healthz
      tags: [System]
      summary: Liveness
      security: []
      responses:
        "200": { description: OK }
  /readyz:
    get:
      operationId: readyz
      tags: [System]
      summary: Readiness (checks the database)
      security: []
      responses:
        "200": { description: Ready }
        "503": { description: Database unavailable }

  /openapi.yaml:
    get:
      operationId: getOpenApi
      tags: [System]
      summary: This OpenAPI document
      security: []
      responses:
        "200": { description: OK }
  /docs:
    get:
      operationId: getDocs
      tags: [System]
      summary: Swagger UI for this document
      security: []
      responses:
        "200": { description: HTML page }

  /v1/public/menus/{tenantSlug}/{venueSlug}:
    get:
      tags: [Public]
      operationId: getPublicMenu
      summary: Published menu for guests (no auth)
      description: |
        The venue's active published menu as one JSON document, for `{tenantSlug}.menuly.app/{venueSlug}`.
        Only visible categories and items are included. Unavailable items are included with
        `is_available: false`, after the available items of their category; otherwise `position` order.

        `languages` lists what the menu offers, Serbian first; with only one entry the guest UI shows
        no language picker. With `lang` set to one of those codes (e.g. `en`, `de`), `name`,
        `description` and `label` are translated where a translation exists and fall back to Serbian;
        `translations` is included as well. A `lang` the menu does not offer is served as `sr`.

        Cached: `Cache-Control: public, max-age=30, stale-while-revalidate=60` and an `ETag`;
        send `If-None-Match` to get `304`. CORS allows any origin.
      security: []
      parameters:
        - { name: tenantSlug, in: path, required: true, schema: { type: string } }
        - { name: venueSlug, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, required: false, schema: { type: string, pattern: "^[a-z]{2,3}(-[a-z0-9]{2,8})?$", default: sr } }
        - { name: If-None-Match, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicMenu" }
        "304": { description: Not modified (ETag matched) }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/auth/register:
    post:
      operationId: register
      tags: [Auth]
      summary: Register an owner and create their tenant
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, business_name]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                business_name: { type: string }
                tenant_slug:
                  type: string
                  pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
                  maxLength: 40
                  description: |
                    Public subdomain ({tenant_slug}.menuly.app). Optional: derived from
                    business_name when omitted (random suffix on collision). Reserved:
                    www, api, app, admin, mail, static, cdn, docs, help, support, status, blog.
                locale: { type: string, default: sr-Latn }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TokenPair"
                  - type: object
                    properties:
                      user: { $ref: "#/components/schemas/User" }
                      tenant: { $ref: "#/components/schemas/Tenant" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Log in
      description: Without `tenant_id` the first active tenant of the user is used.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
                tenant_id: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: Rotate the refresh token
      description: Each refresh token works once. Reusing a used token revokes all sessions of the user.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Revoke a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { description: Revoked (also returned for unknown tokens) }
  /v1/auth/switch-tenant:
    post:
      operationId: switchTenant
      tags: [Auth]
      summary: Get tokens for another tenant the user belongs to
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/me:
    get:
      operationId: getMe
      tags: [Auth]
      summary: Current user, tenant, role and all memberships
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  tenant: { $ref: "#/components/schemas/Tenant" }
                  role: { $ref: "#/components/schemas/Role" }
                  venue_ids:
                    type: array
                    items: { type: string, format: uuid }
                    description: Venues the caller is limited to in the current tenant; empty = every venue (always empty for owners).
                  memberships:
                    type: array
                    items:
                      type: object
                      properties:
                        tenant_id: { type: string, format: uuid }
                        tenant_name: { type: string }
                        tenant_status: { type: string }
                        role: { $ref: "#/components/schemas/Role" }
                        venue_ids:
                          type: array
                          items: { type: string, format: uuid }
                          description: Empty = every venue of that tenant.
        "401": { $ref: "#/components/responses/Error" }

  /v1/venues:
    get:
      operationId: listVenues
      tags: [Venues]
      summary: List venues of the current tenant
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Venue" }
    post:
      operationId: createVenue
      tags: [Venues]
      summary: Create a venue (owner)
      description: |
        When `slug` is omitted it is generated from `name` (Serbian Latin/Cyrillic transliterated).
        The slug is unique within the tenant and may not be en, sr, api or assets (used by the web app); the public menu lives at {tenant_slug}.menuly.app/{venue_slug}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/VenueInput"
                - required: [name]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Venue" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/venues/{venueID}:
    parameters:
      - { name: venueID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getVenue
      tags: [Venues]
      summary: Get a venue
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Venue" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateVenue
      tags: [Venues]
      summary: Update a venue (owner, manager). Omitted fields are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenueInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Venue" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteVenue
      tags: [Venues]
      summary: Delete a venue (owner)
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/venues/{venueID}/menus:
    parameters:
      - $ref: "#/components/parameters/VenueID"
    get:
      operationId: listMenus
      tags: [Menus]
      summary: List menus of a venue (without content)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Menu" } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createMenu
      tags: [Menus]
      summary: Create a draft menu (owner, manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Menu" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/venues/{venueID}/public-link:
    parameters:
      - $ref: "#/components/parameters/VenueID"
    get:
      tags: [Venues]
      operationId: getVenuePublicLink
      summary: The guest URL of the venue's menu ({tenant}.menuly.app/{venue})
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri, example: "https://kafana-djordje.menuly.app/centar" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/venues/{venueID}/qr:
    parameters:
      - $ref: "#/components/parameters/VenueID"
    get:
      tags: [Venues]
      operationId: getVenueQr
      summary: QR code for the venue's public menu URL (PNG or SVG)
      description: |
        Encodes the URL from `/public-link`. SVG prints sharp at any size; PNG is `size`×`size` pixels.
        `download=1` adds `Content-Disposition: attachment; filename="menuly-{venue}.png"`.
        Use it in an `<img>` via a blob URL, since the request needs the `Authorization` header.
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [png, svg], default: png } }
        - { name: size, in: query, schema: { type: integer, minimum: 128, maximum: 2048, default: 512 } }
        - { name: download, in: query, schema: { type: string, enum: ["1"] } }
      responses:
        "200":
          description: The image
          content:
            image/png:
              schema: { type: string, format: binary }
            image/svg+xml:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/venues/{venueID}/promotions:
    parameters:
      - $ref: "#/components/parameters/VenueID"
    get:
      tags: [Promotions]
      operationId: listVenuePromotions
      summary: Promotions of a venue in display order
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Promotion" } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [Promotions]
      operationId: createPromotion
      summary: Create a combo (owner, manager)
      description: |
        `name`, `price_minor` and `slots` are required. Each slot is one fixed item (one option) or a choice
        (several options); `quantity` defaults to 1. Options reference items of this venue's menus; `variant_id`
        pins a size, otherwise the item's cheapest variant counts. `is_active` defaults to true.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromotionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Promotion" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/venues/{venueID}/promotions/order:
    parameters:
      - $ref: "#/components/parameters/VenueID"
    put:
      tags: [Promotions]
      operationId: reorderPromotions
      summary: Reorder the venue's promotions (owner, manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Promotion" } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/promotions/{promotionID}:
    parameters:
      - $ref: "#/components/parameters/PromotionID"
    get:
      tags: [Promotions]
      operationId: getPromotion
      summary: One promotion
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Promotion" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Promotions]
      operationId: updatePromotion
      summary: Change a promotion (owner, manager)
      description: |
        Any subset of fields. `starts_at` / `ends_at` set to `null` remove that limit.
        `slots`, when given, replaces all slots.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromotionInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Promotion" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Promotions]
      operationId: deletePromotion
      summary: Delete a promotion (owner, manager)
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/venues/{venueID}/imports:
    parameters:
      - $ref: "#/components/parameters/VenueID"
    get:
      tags: [Imports]
      operationId: listVenueImports
      summary: Imports of a venue, newest first, with the venue's import quota
      description: Items have no `draft` and `pages`; fetch one import for those.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Import" } }
                  import_limit: { type: integer, description: "Imports this venue may run (default 3)" }
                  imports_used: { type: integer, description: "Imports that count against the limit (all except failed)" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [Imports]
      operationId: createImport
      summary: Upload photos/PDFs of an existing menu (owner, manager)
      description: |
        `multipart/form-data` with one or more `files` parts: JPEG, PNG, WebP or PDF, at most 15 MB each,
        at most 20 pages in total (a PDF counts its pages). Photos are auto-rotated and scaled down.
        Several overlapping phone photos of one menu are fine: send them in reading order; categories that continue
        on the next photo are merged and rows repeated by the overlap are dropped.
        HEIC is not accepted: on iPhone, `accept="image/jpeg,image/png,image/webp,application/pdf"` makes Safari convert.

        Answers `202` right away with status `processing`; every file is read in the background.
        Poll `GET /v1/imports/{importID}` (e.g. every 2 s) until the status changes:
        `ready_for_review` (at least one file was read; `error` says how many failed) or `failed`.

        Errors: `409 import_limit_reached` when the venue used its imports (failed imports do not count),
        `415 unsupported_file`, `422 validation_failed` (no files, too many pages, file too big or unreadable),
        `503 imports_unavailable` when storage is not configured on the server.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "202":
          description: Accepted, processing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Import" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/imports/{importID}:
    parameters:
      - $ref: "#/components/parameters/ImportID"
    get:
      tags: [Imports]
      operationId: getImport
      summary: One import with its pages and draft
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Import" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/imports/{importID}/pages:
    parameters:
      - $ref: "#/components/parameters/ImportID"
    post:
      tags: [Imports]
      operationId: addImportPages
      summary: Add forgotten photos to an import (owner, manager)
      description: |
        Same `files` multipart field and rules as the upload; the import's total stays at most 20 pages.
        Does not use up another import. The import goes back to `processing`; new items are appended to the draft
        (after the user's edits, if any).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files: { type: array, items: { type: string, format: binary } }
      responses:
        "202":
          description: Accepted, processing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Import" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/imports/{importID}/pages/{pageID}:
    parameters:
      - $ref: "#/components/parameters/ImportID"
      - $ref: "#/components/parameters/PageID"
    delete:
      tags: [Imports]
      operationId: deleteImportPage
      summary: Remove a wrong photo and its items (owner, manager)
      description: Not while the page is being read, and not the last page (`409 invalid_import_state`).
      responses:
        "200":
          description: The import without that page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Import" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/imports/{importID}/pages/{pageID}/file:
    parameters:
      - $ref: "#/components/parameters/ImportID"
      - $ref: "#/components/parameters/PageID"
    get:
      tags: [Imports]
      operationId: getImportPageFile
      summary: The uploaded file of a page, for the review screen
      description: |
        The stored copy: photos as JPEG (already rotated and scaled), PDFs as uploaded.
        Load it through a blob URL, since the request needs the `Authorization` header.
        Each draft item's `page_index` points at the page it came from.
      responses:
        "200":
          description: The file
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }

    put:
      tags: [Imports]
      operationId: replaceImportPageFile
      summary: Retake a photo (owner, manager)
      description: |
        Multipart with one `file`. Replaces the page's file and reads it again; the page's old items leave the draft,
        the user's other edits stay and the new reading is appended. Use it for pages with `photo_quality` poor/partial
        or a failed page with `error_code` `no_items`/`unreadable`. Not while the page is being read.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "202":
          description: Accepted, processing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Import" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/imports/{importID}/pages/{pageID}/retry:
    parameters:
      - $ref: "#/components/parameters/ImportID"
      - $ref: "#/components/parameters/PageID"
    post:
      tags: [Imports]
      operationId: retryImportPage
      summary: Read a failed page again (owner, manager)
      description: |
        Only pages with status `failed`. The import goes back to `processing`; poll as after upload.
        If the draft was already edited, the edits are kept and the page's result is appended.
        Retrying a `failed` import counts against the limit again (`409 import_limit_reached`).
      responses:
        "202":
          description: Accepted, processing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Import" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/imports/{importID}/draft:
    parameters:
      - $ref: "#/components/parameters/ImportID"
    put:
      tags: [Imports]
      operationId: updateImportDraft
      summary: Save the reviewer's corrections (owner, manager)
      description: |
        Replaces the whole draft. Only while the import is `ready_for_review` (else `409 invalid_import_state`).
        Nothing is checked here, so half-done edits can be saved; the checks run on commit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportDraft" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Import" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/imports/{importID}/commit:
    parameters:
      - $ref: "#/components/parameters/ImportID"
    post:
      tags: [Imports]
      operationId: commitImport
      summary: Turn the draft into menu content (owner, manager)
      description: |
        Give exactly one of `menu_id` (an existing menu of the same venue: categories with the same name,
        case-insensitive, get the new items appended; others are added) or `menu_name` (creates a new draft menu).
        Every category and item needs a name and every variant a `price_minor`, else `422 draft_invalid`
        with the list of problems in `message`. Only once, from `ready_for_review`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                menu_id: { type: string, format: uuid }
                menu_name: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Committed
          content:
            application/json:
              schema:
                type: object
                properties:
                  import: { $ref: "#/components/schemas/Import" }
                  menu_id: { type: string, format: uuid }
                  items_created: { type: integer }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/menus/{menuID}:
    parameters:
      - $ref: "#/components/parameters/MenuID"
    get:
      operationId: getMenu
      tags: [Menus]
      summary: Full menu tree for the admin editor
      description: |
        Categories, their items and each item's variants, every level ordered by `position`.
        Hidden and unavailable entries are included (this is the admin view, not the public menu).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenuTree" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateMenu
      tags: [Menus]
      summary: Rename a menu or set its languages (owner, manager)
      description: |
        Send `name`, `languages` or both. `languages` replaces the whole list of languages offered
        besides Serbian (`sr` is not allowed in it; at most 10; codes unique). Removing a language
        keeps its translations, so adding it back restores them. Send `[]` for Serbian only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                languages:
                  type: array
                  maxItems: 10
                  items: { $ref: "#/components/schemas/MenuLanguage" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Menu" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMenu
      tags: [Menus]
      summary: Delete a menu with all its content (owner, manager)
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/menus/{menuID}/publish:
    parameters:
      - $ref: "#/components/parameters/MenuID"
    post:
      operationId: publishMenu
      tags: [Menus]
      summary: Publish (owner, manager)
      description: |
        Makes this the venue's only published menu: any other published menu of the venue
        goes back to `draft`, and `venue.active_menu_id` points to this menu.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Menu" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/menus/{menuID}/unpublish:
    parameters:
      - $ref: "#/components/parameters/MenuID"
    post:
      operationId: unpublishMenu
      tags: [Menus]
      summary: Back to draft (owner, manager); clears venue.active_menu_id if it was published
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Menu" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/menus/{menuID}/theme:
    parameters:
      - $ref: "#/components/parameters/MenuID"
    get:
      operationId: getMenuTheme
      tags: [Menus]
      summary: How the public menu is drawn (template, accent, font, options)
      description: A menu that never saved a theme returns the defaults.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenuTheme" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: putMenuTheme
      tags: [Menus]
      summary: Save the theme (owner, manager); fields left out keep their value
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MenuTheme" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenuTheme" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/menus/{menuID}/categories:
    parameters:
      - $ref: "#/components/parameters/MenuID"
    post:
      operationId: createCategory
      tags: [Categories]
      summary: Add a category at the end of the menu (owner, manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CategoryInput"
                - required: [name]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/menus/{menuID}/categories/order:
    parameters:
      - $ref: "#/components/parameters/MenuID"
    put:
      operationId: reorderCategories
      tags: [Categories]
      summary: Reorder categories (drag & drop) (owner, manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "200":
          description: Categories in the new order
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Category" } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/menus/{menuID}/price-adjustments:
    parameters:
      - $ref: "#/components/parameters/MenuID"
    post:
      operationId: adjustPrices
      tags: [Prices]
      summary: Bulk price change for the whole menu or one category (owner, manager)
      description: |
        Exactly one of `percent` or `amount_minor`. Each changed price is written to the price history.
        Example: `{"category_id": "...", "percent": 10, "round_to_minor": 1000}` raises drinks by 10%
        and rounds to the nearest 10 RSD.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id: { type: string, format: uuid, description: "Limit to one category of this menu" }
                percent: { type: number, minimum: -90, maximum: 500, description: "+10 = 10% more" }
                amount_minor: { type: integer, format: int64, description: "Added to every price (negative to lower)" }
                round_to_minor: { type: integer, format: int64, minimum: 0, default: 0, description: "Round to the nearest multiple; 0 = no rounding" }
      responses:
        "200":
          description: Number of prices that changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/categories/{categoryID}:
    parameters:
      - $ref: "#/components/parameters/CategoryID"
    patch:
      operationId: updateCategory
      tags: [Categories]
      summary: Update a category (owner, manager). Omitted fields are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteCategory
      tags: [Categories]
      summary: Delete a category and its items (owner, manager)
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/categories/{categoryID}/items:
    parameters:
      - $ref: "#/components/parameters/CategoryID"
    post:
      operationId: createItem
      tags: [Items]
      summary: Add an item at the end of the category (owner, manager)
      description: Send `price_minor` for a single price, or `variants` for sizes (not both).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemWithVariants" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/categories/{categoryID}/items/order:
    parameters:
      - $ref: "#/components/parameters/CategoryID"
    put:
      operationId: reorderItems
      tags: [Items]
      summary: Reorder items in a category (owner, manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "204": { description: Reordered }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/items/{itemID}:
    parameters:
      - $ref: "#/components/parameters/ItemID"
    get:
      operationId: getItem
      tags: [Items]
      summary: Get an item with its variants
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemWithVariants" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateItem
      tags: [Items]
      summary: Update an item (owner, manager). Omitted fields are unchanged.
      description: Setting `category_id` moves the item to the end of another category of the same menu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ItemInput"
                - type: object
                  properties:
                    category_id: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemWithVariants" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteItem
      tags: [Items]
      summary: Delete an item (owner, manager)
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/items/{itemID}/status:
    parameters:
      - $ref: "#/components/parameters/ItemID"
    patch:
      operationId: updateItemStatus
      tags: [Items]
      summary: Quick toggle "nema na stanju" / hide (every role, including staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                is_available: { type: boolean }
                is_visible: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/items/{itemID}/variants:
    parameters:
      - $ref: "#/components/parameters/ItemID"
    post:
      operationId: createVariant
      tags: [Items]
      summary: Add a variant (size) to an item (owner, manager). Max 20 per item.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/VariantInput"
                - required: [price_minor]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Variant" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/variants/{variantID}:
    parameters:
      - $ref: "#/components/parameters/VariantID"
    patch:
      operationId: updateVariant
      tags: [Prices]
      summary: Change a variant's label or price (owner, manager)
      description: A changed `price_minor` is written to the price history.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VariantInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Variant" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteVariant
      tags: [Items]
      summary: Delete a variant (owner, manager)
      description: The last variant of an item cannot be deleted (409 `last_variant`); delete the item instead.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/variants/{variantID}/price-history:
    parameters:
      - $ref: "#/components/parameters/VariantID"
    get:
      operationId: getPriceHistory
      tags: [Prices]
      summary: Price history of a variant (newest first, last 100)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PriceChange" } }
        "404": { $ref: "#/components/responses/Error" }

  /v1/public/menus/{tenantSlug}/{venueSlug}/views:
    post:
      tags: [Public]
      operationId: countPublicMenuView
      summary: Count a menu open (no auth)
      description: |
        Call once per guest visit (e.g. once per browser session), not on every refresh or language switch.
        Counted per day in the venue's time zone; see `GET /v1/venues/{venueID}/stats`.
      security: []
      parameters:
        - { name: tenantSlug, in: path, required: true, schema: { type: string } }
        - { name: venueSlug, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Counted }
        "404": { $ref: "#/components/responses/Error" }
  /v1/public/media/{tenantID}/{name}:
    get:
      tags: [Media]
      operationId: getPublicMedia
      summary: An uploaded image (no auth)
      description: |
        The `url` returned by `POST /v1/media/images` points here. Files never change, so they are
        cached for a year (`Cache-Control: public, max-age=31536000, immutable`).
      security: []
      parameters:
        - { name: tenantID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: name, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f-]{36}\\.(jpg|png)$" } }
      responses:
        "200":
          description: The image
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
  /v1/public/invitations/{token}:
    get:
      tags: [Team]
      operationId: getPublicInvitation
      summary: What an invitation link is for (no auth)
      description: |
        For the `/invite?token=` page. `has_account` tells the page whether to ask the person to log in
        (then accept with their access token) or to register with a name and password.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string }
                  role: { type: string, enum: [manager, staff] }
                  tenant_name: { type: string }
                  expires_at: { type: string, format: date-time }
                  status: { type: string, enum: [pending, accepted, revoked, expired] }
                  has_account: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }

  /v1/auth/accept-invite:
    post:
      tags: [Auth]
      operationId: acceptInvite
      summary: Accept an invitation and get tokens for the inviting tenant
      description: |
        Logged in (send `Authorization`): the account's email must match the invitation, otherwise 403
        `invite_email_mismatch`. Not logged in: `name` and `password` create the account; if an account
        with that email already exists, 409 `login_required`. An expired, revoked or used link is 400 `invalid_token`;
        409 `already_member` if the user already belongs to the tenant.
      security: [{}, { bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                name: { type: string, description: "Required for a new account" }
                password: { type: string, minLength: 8, description: "Required for a new account" }
      responses:
        "200":
          description: OK, tokens for the inviting tenant
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TokenPair"
                  - type: object
                    properties:
                      user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Email a password reset link
      description: |
        Always 204, whether or not the email has an account. The link is `{APP_URL}/reset-password?token=...`,
        valid for one hour; at most 3 links per account per hour.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "204": { description: Accepted }
        "422": { $ref: "#/components/responses/Error" }
  /v1/auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with a reset link's token
      description: |
        Signs the user out everywhere (all refresh tokens are revoked); log in again afterwards.
        An unknown, expired or used token is 400 `invalid_token`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/media/images:
    post:
      tags: [Media]
      operationId: uploadImage
      summary: Upload an image for an item, logo, cover or promotion (owner, manager)
      description: |
        JPEG, PNG or WebP up to 10 MB (HEIC is 415: ask the phone to send JPEG). The image is rotated
        upright, scaled down (item and promotion 1600 px, cover 2400 px, logo 512 px on the long side)
        and re-encoded: JPEG, or PNG for a logo with transparency. Put the returned `url` in an item's
        `image_url`, a promotion's `image_url` or a theme's `logo_url`/`cover_url`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                purpose: { type: string, enum: [item, logo, cover, promotion], default: item }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  url: { type: string, format: uri, example: "https://api.menuly.app/v1/public/media/0192.../0193....jpg" }
                  mime: { type: string, enum: [image/jpeg, image/png] }
                  width: { type: integer }
                  height: { type: integer }
                  size_bytes: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/venues/{venueID}/stats:
    parameters:
      - $ref: "#/components/parameters/VenueID"
    get:
      tags: [Venues]
      operationId: getVenueStats
      summary: Menu opens per day
      description: Days in the venue's time zone, oldest first, ending today; days without opens are 0.
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  days:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        views: { type: integer }
                  total: { type: integer }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/members:
    get:
      tags: [Team]
      operationId: listMembers
      summary: Members of the tenant (owner, manager)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/members/{userID}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    patch:
      tags: [Team]
      operationId: updateMember
      summary: Change a member's role or venues (owner)
      description: |
        Send `role`, `venue_ids` or both (422 if neither). The owner cannot be changed (404).
        A new role applies from the member's next login or token refresh; new `venue_ids` apply to their next request.
        `venue_ids` must be venues of this tenant (422 otherwise); duplicates are dropped; `[]` gives access to every venue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [manager, staff] }
                venue_ids:
                  type: array
                  maxItems: 200
                  items: { type: string, format: uuid }
                  description: Venues the member may work in; empty = every venue.
      responses:
        "204": { description: Updated }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Team]
      operationId: removeMember
      summary: Remove a manager or staff member (owner)
      description: Also signs them out of this tenant. The owner cannot be removed (404).
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/invitations:
    get:
      tags: [Team]
      operationId: listInvitations
      summary: Pending invitations (owner, manager)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [Team]
      operationId: createInvitation
      summary: Invite someone by email (owner, manager)
      description: |
        Owners invite managers or staff, managers invite staff only (403 otherwise). The email holds a link to
        `{APP_URL}/invite?token=...`, valid for 7 days. A new invitation replaces a pending one for the same email.
        409 `already_member` if the person is already in the tenant.

        `venue_ids` limits the new member to those venues once they accept (empty or missing = every venue).
        A manager who is limited to some venues must pick at least one (422 `venue_ids_required`) and can
        only pick their own (422 `validation_failed` for any other).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [manager, staff] }
                venue_ids:
                  type: array
                  maxItems: 200
                  items: { type: string, format: uuid }
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/invitations/{invitationID}:
    parameters:
      - { name: invitationID, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Team]
      operationId: revokeInvitation
      summary: Revoke a pending invitation (owner, manager)
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/tenants:
    get:
      tags: [Admin]
      operationId: adminListTenants
      summary: All tenants with usage counts (platform admin)
      description: Newest first, at most 200. `q` matches name or slug.
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminTenantSummary" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/admin/tenants/{tenantID}:
    parameters:
      - $ref: "#/components/parameters/TenantID"
    get:
      tags: [Admin]
      operationId: adminGetTenant
      summary: A tenant with its owners and venues (platform admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant: { $ref: "#/components/schemas/Tenant" }
                  owners:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        email: { type: string }
                  venues:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        slug: { type: string }
                        ocr_import_limit: { type: integer }
                        imports_used: { type: integer }
                        created_at: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Admin]
      operationId: adminUpdateTenant
      summary: Suspend or reactivate a tenant (platform admin)
      description: A suspended tenant's public menus return 404 and its users cannot log in to it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, suspended] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/admin/venues/{venueID}:
    parameters:
      - $ref: "#/components/parameters/VenueID"
    patch:
      tags: [Admin]
      operationId: adminUpdateVenue
      summary: Set a venue's OCR import limit (platform admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ocr_import_limit]
              properties:
                ocr_import_limit: { type: integer, minimum: 0, maximum: 1000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Venue" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/admin/ocr-usage:
    get:
      tags: [Admin]
      operationId: adminOcrUsage
      summary: OCR pages, tokens and estimated cost per tenant and model (platform admin)
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        tenant_id: { type: string, format: uuid }
                        tenant_name: { type: string }
                        model: { type: string }
                        pages: { type: integer }
                        input_tokens: { type: integer }
                        output_tokens: { type: integer }
                        cost_micros: { type: integer, description: "USD millionths" }
                  total_cost_micros: { type: integer }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

components:
  parameters:
    VenueID:
      name: venueID
      in: path
      required: true
      schema: { type: string, format: uuid }
    MenuID:
      name: menuID
      in: path
      required: true
      schema: { type: string, format: uuid }
    CategoryID:
      name: categoryID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemID:
      name: itemID
      in: path
      required: true
      schema: { type: string, format: uuid }
    VariantID:
      name: variantID
      in: path
      required: true
      schema: { type: string, format: uuid }
    PromotionID:
      name: promotionID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImportID:
      name: importID
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageID:
      name: pageID
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserID:
      name: userID
      in: path
      required: true
      schema: { type: string, format: uuid }
    TenantID:
      name: tenantID
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, examples: [validation_failed, slug_taken, forbidden] }
                  message: { type: string }
  schemas:
    Role:
      type: string
      enum: [owner, manager, staff]
    TokenPair:
      type: object
      properties:
        token_type: { type: string, const: Bearer }
        access_token: { type: string }
        access_token_expires_at: { type: string, format: date-time }
        refresh_token: { type: string }
        refresh_token_expires_at: { type: string, format: date-time }
        tenant_id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        locale: { type: string }
        is_platform_admin: { type: boolean, description: "Show the admin screens; /v1/admin/* checks it on every request" }
    Member:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        venue_ids:
          type: array
          items: { type: string, format: uuid }
          description: Venues the member is limited to; empty = every venue (always empty for the owner). May name a deleted venue, which clients should ignore.
        created_at: { type: string, format: date-time, description: "When they joined" }
    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string, enum: [manager, staff] }
        venue_ids:
          type: array
          items: { type: string, format: uuid }
          description: Venues the person gets on accept; empty = every venue.
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    AdminTenantSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [active, suspended] }
        plan: { type: string }
        created_at: { type: string, format: date-time }
        venues: { type: integer }
        members: { type: integer }
        imports: { type: integer }
        ocr_cost_micros: { type: integer, description: "Estimated OCR cost, USD millionths" }
        views_30d: { type: integer, description: "Menu opens in the last 30 days" }
    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string, description: "Public subdomain" }
        plan: { type: string }
        status: { type: string, enum: [active, suspended] }
    VenueInput:
      type: object
      properties:
        name: { type: string }
        slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 60 }
        address: { type: string }
        phone: { type: string }
        currency: { type: string, pattern: "^[A-Z]{3}$", default: RSD }
        timezone: { type: string, default: Europe/Belgrade }
        opening_hours: { $ref: "#/components/schemas/OpeningHours" }
        wifi_available:
          type: boolean
          default: false
          description: Whether the venue offers Wi-Fi to guests. `true` needs a non-empty `wifi_ssid` (checked on the saved row, so a PATCH may send them separately only if the name is already set).
        wifi_ssid: { type: string, maxLength: 32, description: "Network name (trimmed, max 32 bytes)" }
        wifi_password: { type: string, maxLength: 63, description: "Kept as typed, not trimmed. Empty for an open network." }
        wifi_access: { $ref: "#/components/schemas/WifiAccess" }
    OpeningHours:
      type: object
      description: |
        Weekly opening hours: up to 3 `[open, close]` intervals per weekday, times as `HH:MM` (00:00-23:59)
        in the venue's `timezone`. A missing or empty day is closed. A close at or before the open time means
        the interval runs past midnight (`["17:00", "01:00"]`). `{}` means the hours are not set (do not show them).
        The server drops empty days; key order is not meaningful.
      properties:
        mon: { $ref: "#/components/schemas/DayHours" }
        tue: { $ref: "#/components/schemas/DayHours" }
        wed: { $ref: "#/components/schemas/DayHours" }
        thu: { $ref: "#/components/schemas/DayHours" }
        fri: { $ref: "#/components/schemas/DayHours" }
        sat: { $ref: "#/components/schemas/DayHours" }
        sun: { $ref: "#/components/schemas/DayHours" }
      additionalProperties: false
      example: { mon: [["08:00", "23:00"]], fri: [["08:00", "15:00"], ["17:00", "01:00"]] }
    DayHours:
      type: array
      maxItems: 3
      items:
        type: array
        minItems: 2
        maxItems: 2
        items: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
    WifiAccess:
      type: string
      enum: [menu, staff]
      default: staff
      description: "How guests get the Wi-Fi password: `menu` shows it on the public menu, `staff` shows only the network name and tells guests to ask the staff."
    Venue:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        address: { type: string }
        phone: { type: string }
        currency: { type: string }
        timezone: { type: string }
        opening_hours: { $ref: "#/components/schemas/OpeningHours" }
        wifi_available: { type: boolean }
        wifi_ssid: { type: string }
        wifi_password: { type: string, description: "Admin only; the public menu shows it only when wifi_access is menu" }
        wifi_access: { $ref: "#/components/schemas/WifiAccess" }
        ocr_import_limit: { type: integer, description: "OCR imports allowed for this venue (read-only, default 3)" }
        active_menu_id: { type: [string, "null"], format: uuid, description: "The published menu guests see" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Translations:
      type: object
      description: |
        Translations keyed by language code (not `sr`; Serbian is the base field). Use the codes
        in the menu's `languages`; text for other codes is kept but not shown to guests. Example: `{"en": {"name": "Drinks", "description": "..."}}`. Send `null` or `{}` to clear.
      additionalProperties:
        type: object
        additionalProperties: { type: string }
      example: { en: { name: Drinks } }
    OrderInput:
      type: object
      required: [ids]
      description: Every child ID exactly once, in the new order.
      properties:
        ids: { type: array, items: { type: string, format: uuid } }
    Menu:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        venue_id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [draft, published] }
        published_at: { type: [string, "null"], format: date-time }
        languages:
          type: array
          description: Languages offered besides Serbian, which is the base and always offered.
          items: { $ref: "#/components/schemas/MenuLanguage" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MenuLanguage:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          pattern: "^[a-z]{2,3}(-[a-z0-9]{2,8})?$"
          description: Lowercase language code, e.g. `en`, `de`, `pt-br`. Keys `translations`.
        name: { type: string, maxLength: 40, description: "How guests see it in the picker, e.g. Deutsch" }
      example: { code: de, name: Deutsch }
    MenuTree:
      allOf:
        - $ref: "#/components/schemas/Menu"
        - type: object
          properties:
            categories:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/Category"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/ItemWithVariants" } }
    CategoryInput:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string }
        translations: { $ref: "#/components/schemas/Translations" }
        is_visible: { type: boolean, default: true }
    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        menu_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        translations: { $ref: "#/components/schemas/Translations" }
        position: { type: integer }
        is_visible: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ItemInput:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string }
        translations:
          allOf:
            - $ref: "#/components/schemas/Translations"
          description: "Allowed fields: name, description"
        image_url: { type: string, format: uri }
        tags: { type: array, maxItems: 20, items: { type: string, maxLength: 40 }, description: "Lowercased and de-duplicated, e.g. vegan, ljuto" }
        allergens: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }
        is_available: { type: boolean, default: true, description: "false = nema na stanju" }
        is_visible: { type: boolean, default: true }
    ItemCreate:
      allOf:
        - $ref: "#/components/schemas/ItemInput"
        - type: object
          required: [name]
          properties:
            price_minor: { type: integer, format: int64, minimum: 0, description: "Single price; creates one variant with an empty label" }
            variants:
              type: array
              minItems: 1
              maxItems: 20
              items:
                allOf:
                  - $ref: "#/components/schemas/VariantInput"
                  - required: [price_minor]
    Item:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        translations: { $ref: "#/components/schemas/Translations" }
        image_url: { type: string }
        tags: { type: array, items: { type: string } }
        allergens: { type: array, items: { type: string } }
        position: { type: integer }
        is_available: { type: boolean }
        is_visible: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ItemWithVariants:
      allOf:
        - $ref: "#/components/schemas/Item"
        - type: object
          properties:
            variants: { type: array, items: { $ref: "#/components/schemas/Variant" } }
    VariantInput:
      type: object
      properties:
        label: { type: string, maxLength: 100, description: "e.g. 0,5 l; empty for a single price" }
        translations:
          allOf:
            - $ref: "#/components/schemas/Translations"
          description: "Allowed field: label"
        price_minor: { type: integer, format: int64, minimum: 0, description: "Minor units of the venue currency (35000 = 350,00 RSD)" }
    Variant:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        label: { type: string }
        translations: { $ref: "#/components/schemas/Translations" }
        price_minor: { type: integer, format: int64 }
        position: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PriceChange:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        variant_id: { type: string, format: uuid }
        old_price_minor: { type: integer, format: int64 }
        new_price_minor: { type: integer, format: int64 }
        changed_by: { type: [string, "null"], format: uuid }
        changed_at: { type: string, format: date-time }
    PromotionInput:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        translations: { $ref: "#/components/schemas/Translations" }
        image_url: { type: string, description: "Empty or an http(s) URL" }
        price_minor: { type: integer, format: int64, minimum: 0 }
        starts_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time, description: "Must be after starts_at" }
        is_active: { type: boolean }
        is_featured: { type: boolean }
        slots:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [options]
            properties:
              label: { type: string, maxLength: 100, examples: ["Piće po izboru"] }
              translations: { $ref: "#/components/schemas/Translations" }
              quantity: { type: integer, minimum: 1, maximum: 20, default: 1 }
              options:
                type: array
                minItems: 1
                maxItems: 20
                items:
                  type: object
                  required: [item_id]
                  properties:
                    item_id: { type: string, format: uuid }
                    variant_id: { type: [string, "null"], format: uuid }
    Promotion:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        venue_id: { type: string, format: uuid }
        type: { type: string, enum: [combo] }
        name: { type: string }
        description: { type: string }
        translations: { $ref: "#/components/schemas/Translations" }
        image_url: { type: string }
        price_minor: { type: integer, format: int64 }
        starts_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        is_active: { type: boolean }
        is_featured: { type: boolean }
        position: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        status:
          type: string
          enum: [live, scheduled, expired, inactive]
          description: "inactive = switched off; otherwise from the validity window and the current time"
        regular_price_minor: { type: integer, format: int64, description: "Slots bought one by one (cheapest option of a choice), at current prices" }
        savings_minor: { type: integer, format: int64, description: "regular_price_minor - price_minor, never negative" }
        slots:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              label: { type: string }
              translations: { $ref: "#/components/schemas/Translations" }
              quantity: { type: integer }
              options:
                type: array
                description: An option disappears when its item is deleted; a slot can then be empty (guests do not see the combo).
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    item_id: { type: string, format: uuid }
                    variant_id: { type: [string, "null"], format: uuid }
                    item_name: { type: string }
                    variant_label: { type: [string, "null"] }
                    price_minor: { type: integer, format: int64 }
                    is_available: { type: boolean }
                    in_active_menu: { type: boolean, description: "False when the item is hidden or not in the venue's active menu" }
    Import:
      type: object
      properties:
        id: { type: string, format: uuid }
        venue_id: { type: string, format: uuid }
        status:
          type: string
          enum: [processing, ready_for_review, failed, committed]
        error: { type: string, description: "Empty, or e.g. \"1 of 3 files could not be read\"" }
        draft_edited: { type: boolean }
        committed_menu_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        committed_at: { type: [string, "null"], format: date-time }
        summary:
          description: Counts for the review screen, present once there is a draft.
          type: object
          properties:
            categories: { type: integer }
            items: { type: integer }
            items_to_check: { type: integer, description: "Items with an uncertain name or price, or a possible duplicate" }
            missing_prices: { type: integer, description: "Items with a variant without price_minor; commit needs 0" }
        draft:
          description: Null until a page has been read. Not included in lists.
          oneOf:
            - { $ref: "#/components/schemas/ImportDraft" }
            - { type: "null" }
        pages:
          description: Not included in lists.
          type: array
          items: { $ref: "#/components/schemas/ImportPage" }
    ImportPage:
      type: object
      properties:
        id: { type: string, format: uuid }
        page_index: { type: integer, description: "0-based upload order" }
        page_count: { type: integer, description: "Pages in the file (PDF), else 1" }
        status: { type: string, enum: [queued, processing, done, failed] }
        attempts: { type: integer }
        error: { type: string, description: "English detail for logs; show your own text by error_code" }
        error_code:
          type: string
          enum: ["", not_configured, not_a_menu, no_items, unreadable, temporary, gave_up]
          description: |
            Empty unless failed or retrying. `not_a_menu` / `no_items` / `unreadable`: suggest retaking the photo
            (`PUT .../file`). `temporary`: will be retried automatically. `gave_up`: temporary errors on every attempt, use retry.
        filename: { type: string }
        mime: { type: string, examples: [image/jpeg, application/pdf] }
        photo_quality:
          type: string
          enum: ["", good, partial, poor]
          description: The model's view of the photo, once read. Suggest a retake for partial/poor.
        photo_issues:
          type: array
          items: { type: string, enum: [blurry, cut_off, glare, too_dark, too_far, skewed, not_a_menu] }
    ImportDraft:
      type: object
      description: |
        What was read, as printed (no translation). Items whose name or price the model was unsure of list
        them in `uncertain`; highlight those for the reviewer. `price_minor` is null when the printed
        price could not be parsed; `price_text` is the price as printed.
      properties:
        currency: { type: string, examples: [RSD, EUR] }
        categories:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              description: { type: string }
              items:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    description: { type: string }
                    page_index: { type: integer }
                    uncertain:
                      type: array
                      description: |
                        `duplicate`: the same name appears more than once in the category with other prices
                        (overlapping photos repeat rows; exact repeats are already dropped).
                      items: { type: string, enum: [name, price, duplicate] }
                    variants:
                      type: array
                      items:
                        type: object
                        properties:
                          label: { type: string, description: "Size/portion, empty for a single price" }
                          price_minor: { type: [integer, "null"], format: int64 }
                          price_text: { type: string }
    MenuTheme:
      type: object
      description: |
        Keys only, never raw colors or font names: the client maps them to the Receipt design system
        (accent = `[data-tenant]` preset, font = font preset), so every combination stays readable.
      properties:
        template:
          type: string
          enum: [racun, galerija, tabla, etiketa, plakat]
          description: "racun: one column text list; galerija: photo cards; tabla: compact board with variant columns; etiketa: spec labels with item codes, category color stripes and combo tickets; plakat: poster with black capsule category heads and one accent dot"
        accent: { type: string, enum: [tinta, narandza, espresso, bordo, maslina, teget, kobalt, smaragd, senf, roze] }
        font: { type: string, enum: [onest, manrope, plex] }
        color_mode: { type: string, enum: [auto, light, dark], description: "Starting theme; guests can still switch" }
        show_images: { type: boolean }
        show_descriptions: { type: boolean }
        show_pattern: { type: boolean, description: "Venue's generated pattern band in the header" }
        show_illustrations: { type: boolean, description: "Geometric category illustrations, picked by the client from the category name" }
        pattern: { type: string, enum: [bauhaus, trake, mozaik], description: "Which generated band: bauhaus shapes, trake (color bars) or mozaik (animated glyph tiles; featured combos become a dark mosaic card)" }
        logo_url: { type: string, description: "Empty or an http(s) URL" }
        cover_url: { type: string, description: "Empty or an http(s) URL" }
    PublicMenu:
      type: object
      properties:
        theme: { $ref: "#/components/schemas/MenuTheme" }
        lang: { type: string, description: "Language actually served: the requested one when the menu offers it, else sr" }
        languages:
          type: array
          description: Languages the menu offers, Serbian (`sr`) first. One entry means no picker.
          items: { $ref: "#/components/schemas/MenuLanguage" }
        tenant:
          type: object
          properties:
            name: { type: string }
            slug: { type: string }
        venue:
          type: object
          properties:
            name: { type: string }
            slug: { type: string }
            address: { type: string }
            phone: { type: string }
            currency: { type: string }
            timezone: { type: string, description: "IANA zone the opening hours are in" }
            opening_hours: { $ref: "#/components/schemas/OpeningHours" }
            wifi:
              description: "`null` when the venue has no Wi-Fi."
              oneOf:
                - type: "null"
                - type: object
                  properties:
                    ssid: { type: string }
                    password: { type: string, description: "Empty unless access is menu (or the network is open)" }
                    access: { $ref: "#/components/schemas/WifiAccess" }
        menu:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            published_at: { type: [string, "null"], format: date-time }
            categories:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  description: { type: string }
                  translations: { $ref: "#/components/schemas/Translations" }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        description: { type: string }
                        translations: { $ref: "#/components/schemas/Translations" }
                        tags: { type: array, items: { type: string } }
                        allergens: { type: array, items: { type: string } }
                        image_url: { type: string }
                        is_available: { type: boolean }
                        variants:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: string, format: uuid }
                              label: { type: string }
                              translations: { $ref: "#/components/schemas/Translations" }
                              price_minor: { type: integer, format: int64 }
        promotions:
          description: |
            Combos live right now (active and inside their validity window). Options whose item is hidden or
            not in this menu are left out, and a combo with an empty slot is left out entirely. A combo with a slot
            where no option is available has `is_available: false` and comes last. Show `is_featured` ones as a banner.
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              description: { type: string }
              translations: { $ref: "#/components/schemas/Translations" }
              image_url: { type: string }
              price_minor: { type: integer, format: int64 }
              regular_price_minor: { type: integer, format: int64, description: "Sum of the slots bought one by one (cheapest option of a choice)" }
              savings_minor: { type: integer, format: int64, description: "regular_price_minor - price_minor, never negative" }
              ends_at: { type: [string, "null"], format: date-time }
              is_featured: { type: boolean }
              is_available: { type: boolean }
              slots:
                type: array
                items:
                  type: object
                  properties:
                    label: { type: string }
                    quantity: { type: integer }
                    options:
                      type: array
                      items:
                        type: object
                        properties:
                          item_id: { type: string, format: uuid }
                          variant_id: { type: [string, "null"], format: uuid }
                          name: { type: string }
                          variant_label: { type: string }
                          price_minor: { type: integer, format: int64 }
                          is_available: { type: boolean }
