<!-- @dsCard group="Brend" height=420 subtitle="bento pločice za login, landing, reklame" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>BrandTile</title></head>
<body>
<div class="r-brand" style="padding:24px">
  <div class="r-brand-grid">
    <div class="r-brand-tile r-brand-tile--cobalt" style="grid-column: span 2">
      <span class="r-mono-label">[NAZIV] · DIGITALNI MENI</span>
      <h2 class="r-brand-tile__headline">Meni koji ne mora<br>da se štampa.</h2>
    </div>
    <div class="r-brand-tile r-brand-tile--paper" style="padding:0; grid-row: span 2; background: var(--brand-ink)">
      <div data-pattern="Receipt" data-cols="3" data-rows="4" data-cell="96" class="r-pattern--fluid"></div>
    </div>
    <div class="r-brand-tile r-brand-tile--pink">
      <span class="r-mono-label">DANAS · 12:04</span>
      <div><div class="r-brand-tile__number">1.284</div><div class="r-brand-tile__caption">otvaranja menija</div></div>
    </div>
    <div class="r-brand-tile r-brand-tile--amber">
      <span class="r-mono-label">CENA SE MENJA ODMAH</span>
      <div class="r-num" style="font-size:15px; display:flex; justify-content:space-between"><span>Espresso</span><span>220 RSD</span></div>
    </div>
  </div>
</div>
<script src="../Pattern/bauhaus-pattern.js"></script>
<script>ReceiptPattern.renderAll();</script>
</body>
</html>
