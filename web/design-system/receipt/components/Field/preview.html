<!-- @dsCard group="Forme" height=230 subtitle="tekst · cena · greška" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title></head>
<body>
<div class="r-preview">
<label class="r-field">
  <span class="r-field__label">Naziv stavke</span>
  <input class="r-input" placeholder="npr. Espresso macchiato">
  <span class="r-field__hint">Prikazuje se gostima tačno ovako.</span>
</label>
<label class="r-field" style="min-width:180px">
  <span class="r-field__label">Cena</span>
  <span class="r-input-wrap"><input class="r-input r-input--price" value="1.250"><span class="r-input-wrap__suffix">RSD</span></span>
</label>
<label class="r-field r-field--error">
  <span class="r-field__label">Gramaža</span>
  <input class="r-input" value="abc">
  <span class="r-field__hint">Unesi broj, npr. 250.</span>
</label>
</div>
</body>
</html>
