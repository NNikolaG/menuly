<!doctype html>
<html>
<head><meta charset="utf-8"><title>Receipt</title></head>
<body>
<div class="r-brand" style="padding:24px; display:flex">
  <aside class="r-receipt" style="min-height:580px">
    <div class="r-receipt__head"><h2 class="r-receipt__title">Sto 14</h2><span class="r-receipt__id">#A-0381</span></div>
    <div class="r-receipt__meta">4 gosta · otvoren 11:42 · Marko</div>
    <hr class="r-receipt__rule">
    <div class="r-receipt__line"><span class="r-receipt__qty">2×</span><span class="r-receipt__name">Flat white<span class="r-receipt__note">Ovseno mleko</span></span><span class="r-receipt__sum">580</span></div>
    <div class="r-receipt__line"><span class="r-receipt__qty">1×</span><span class="r-receipt__name">Espresso macchiato</span><span class="r-receipt__sum">220</span></div>
    <div class="r-receipt__line"><span class="r-receipt__qty">1×</span><span class="r-receipt__name">Cedevita limun</span><span class="r-receipt__sum">250</span></div>
    <div class="r-receipt__line"><span class="r-receipt__qty">2×</span><span class="r-receipt__name">Kroasan puter<span class="r-receipt__note">Zagrejati</span></span><span class="r-receipt__sum">560</span></div>
    <div style="flex-grow:1"></div>
    <hr class="r-receipt__rule" style="margin-bottom:14px">
    <div class="r-receipt__total-label"><span>Ukupno · 6 stavki</span><span>PDV uklj.</span></div>
    <div class="r-receipt__total"><strong>1.610</strong><span>RSD</span></div>
    <div class="r-receipt__actions"><button type="button" class="r-btn r-btn--pay">Naplati</button><button type="button" class="r-btn r-btn--send">Pošalji u šank</button></div>
    <div class="r-receipt__stamp"><div data-pattern="#A-0381" data-cols="8" data-rows="1" data-cell="40" data-big="false"></div></div>
  </aside>
</div>
<script src="../Pattern/bauhaus-pattern.js"></script>
<script>ReceiptPattern.renderAll();</script>
</body>
</html>
