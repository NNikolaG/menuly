<!doctype html>
<html lang="sr-Latn">
  <head>
    <meta charset="utf-8" />
    <title>Menuly</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;600;700&display=swap"
    />
    <!-- Applies the saved theme before first paint; keep the key in sync with ThemeStore. -->
    <script>
      try {
        const theme = localStorage.getItem('menuly.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
