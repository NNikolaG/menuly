# Whole app with a demo account: `docker compose up --build`
# App:  http://localhost:8000  (demo@menuly.app / demo1234)
# Menu: http://demo.localhost:8000/mornar
# API:  http://localhost:8080  (health: /healthz, /readyz, docs: /docs)
# Developing the web app with `npm start` (:4200) works next to this stack.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: menuly
      POSTGRES_PASSWORD: menuly
      POSTGRES_DB: menuly
      APP_DB_PASSWORD: menuly_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menuly -d menuly"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: ./backend
    command: ["migrate", "up"]
    environment: &api-env
      APP_ENV: development
      DATABASE_URL: postgres://menuly_app:menuly_app@postgres:5432/menuly?sslmode=disable
      MIGRATE_DATABASE_URL: postgres://menuly:menuly@postgres:5432/menuly?sslmode=disable
      JWT_SECRET: dev-only-secret-change-me-in-production-0123456789
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:8000
      # Uploaded menus and images live in the `uploads` volume. Production
      # sets S3_ENDPOINT (any S3-compatible storage) instead.
      STORAGE_DIR: /data/uploads
      PUBLIC_API_URL: http://localhost:8080
      # Links in emails (invites, password reset) and QR codes point at the
      # web container; set APP_URL=http://localhost:4200 in .env to get
      # links for `npm start` instead.
      APP_URL: ${APP_URL:-http://localhost:8000}
      PUBLIC_MENU_URL: http://{tenant}.localhost:8000/{venue}
      # OCR import: put the key and options in .env next to this file (see
      # backend/.env.example). Without a key uploads work but pages fail as
      # "not configured".
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OCR_PROVIDER: ${OCR_PROVIDER:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OCR_MODEL: ${OCR_MODEL:-}
      OCR_FALLBACK_MODEL: ${OCR_FALLBACK_MODEL:-}
      OCR_EFFORT: ${OCR_EFFORT:-medium}
    depends_on:
      postgres:
        condition: service_healthy

  # Demo account (demo@menuly.app / demo1234). Leaves existing data alone;
  # `docker compose run --rm seed seed --reset` starts the demo over.
  seed:
    build: ./backend
    command: ["seed"]
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: ./backend
    command: ["serve"]
    environment: *api-env
    ports:
      - "8080:8080"
    volumes:
      - uploads:/data/uploads
    depends_on:
      seed:
        condition: service_completed_successfully

  # Web app (admin + guest menu) behind nginx, which proxies /api to the API.
  web:
    build: ./web
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "8000:80"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
