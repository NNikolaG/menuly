# Local development stack: `docker compose up --build`
# API: http://localhost:8080  (health: /healthz, /readyz)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: menuly
      POSTGRES_PASSWORD: menuly
      POSTGRES_DB: menuly
      APP_DB_PASSWORD: menuly_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menuly -d menuly"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible storage for uploaded menus. Console: http://localhost:9001
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: menuly
      MINIO_ROOT_PASSWORD: menuly-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: ./backend
    command: ["migrate", "up"]
    environment: &api-env
      APP_ENV: development
      DATABASE_URL: postgres://menuly_app:menuly_app@postgres:5432/menuly?sslmode=disable
      MIGRATE_DATABASE_URL: postgres://menuly:menuly@postgres:5432/menuly?sslmode=disable
      JWT_SECRET: dev-only-secret-change-me-in-production-0123456789
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: menuly
      S3_SECRET_KEY: menuly-minio-secret
      S3_BUCKET: menuly
      PUBLIC_API_URL: http://localhost:8080
      APP_URL: http://localhost:4200
      # OCR import: put the key and options in .env next to this file (see
      # backend/.env.example). Without a key uploads work but pages fail as
      # "not configured".
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OCR_PROVIDER: ${OCR_PROVIDER:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OCR_MODEL: ${OCR_MODEL:-}
      OCR_FALLBACK_MODEL: ${OCR_FALLBACK_MODEL:-}
      OCR_EFFORT: ${OCR_EFFORT:-medium}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    command: ["serve"]
    environment: *api-env
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
